name: Android (unsigned APK + AAB)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "اسم الإصدار (versionName)"
        required: false
        default: "1.2.0"
  push:
    tags:
      - "v*"

env:
  APP_ID: pharaoh.ar
  APP_NAME: فرعون Ai
  COMPILE_SDK: "36"
  TARGET_SDK: "36"
  MIN_SDK: "24"
  # أحدث إصدار من مكتبة الدفع الرسمية لمتجر Google Play
  BILLING_VERSION: "8.0.0"
  # رقم الإصدار يبدأ من 1010
  VERSION_CODE_BASE: "1011"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      # --------------------------------------------------------------
      # فحص توافق سياسة Google Play (لا نصّ مرور مكشوف / لا أدوات هجوم)
      # --------------------------------------------------------------
      - name: Play policy guardrails
        run: |
          echo "🔍 فحص إعدادات الأمان..."
          if grep -q "cleartext: true" capacitor.config.ts; then
            echo "❌ cleartext مفعّل — مرفوض في سياسة Google Play"; exit 1
          fi
          if grep -qE '"\*"' capacitor.config.ts; then
            echo "❌ allowNavigation يحتوي على * — مرفوض أمنيًا"; exit 1
          fi
          echo "✅ الإعدادات آمنة"

      - name: Build web bundle
        run: bun run build

      - name: Ensure webDir exists
        run: mkdir -p dist/client

      - name: Add Android platform
        run: bunx cap add android || true

      - name: Create assets folder
        run: mkdir -p android/app/src/main/assets

      - name: Compute version
        id: version
        run: |
          echo "code=$(( ${VERSION_CODE_BASE} + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="1.2.${{ github.run_number }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Update Target & Compile SDK
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i -E "s/targetSdkVersion\s*=\s*[0-9]+/targetSdkVersion = ${TARGET_SDK}/" android/variables.gradle
            sed -i -E "s/compileSdkVersion\s*=\s*[0-9]+/compileSdkVersion = ${COMPILE_SDK}/" android/variables.gradle
            sed -i -E "s/minSdkVersion\s*=\s*[0-9]+/minSdkVersion = ${MIN_SDK}/" android/variables.gradle
          fi

      - name: Generate app icons
        run: bunx @capacitor/assets generate --android || true

      - name: Sync Capacitor
        run: bunx cap sync android

      # --------------------------------------------------------------
      # أحدث مكتبات الدفع الرسمية لمتجر Google Play
      # --------------------------------------------------------------
      - name: Add latest Google Play Billing libraries
        run: |
          set -e
          GRADLE_FILE=android/app/build.gradle
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE=android/app/build.gradle.kts
          echo "📦 استخدام $GRADLE_FILE"
          if [ "${GRADLE_FILE##*.}" = "kts" ]; then
            printf '\ndependencies {\n    implementation("com.android.billingclient:billing-ktx:%s")\n    implementation("com.google.android.play:review:2.0.2")\n}\nconfigurations.all {\n    resolutionStrategy {\n        force("com.android.billingclient:billing:%s")\n        force("com.android.billingclient:billing-ktx:%s")\n    }\n}\n' "$BILLING_VERSION" "$BILLING_VERSION" "$BILLING_VERSION" >> "$GRADLE_FILE"
          else
            printf '\ndependencies {\n    implementation "com.android.billingclient:billing-ktx:%s"\n    implementation "com.google.android.play:review:2.0.2"\n}\nconfigurations.all {\n    resolutionStrategy {\n        force "com.android.billingclient:billing:%s"\n        force "com.android.billingclient:billing-ktx:%s"\n    }\n}\n' "$BILLING_VERSION" "$BILLING_VERSION" "$BILLING_VERSION" >> "$GRADLE_FILE"
          fi
          grep -n "billingclient" "$GRADLE_FILE"

      # فرض نسخة الدفع على كل الوحدات (الإضافات تجلب نسخة قديمة 4.x)
      - name: Force Billing version for all modules
        run: |
          set -e
          ROOT=android/build.gradle
          [ -f "$ROOT" ] || ROOT=android/build.gradle.kts
          if [ "${ROOT##*.}" = "kts" ]; then
            printf '\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            force("com.android.billingclient:billing:%s")\n            force("com.android.billingclient:billing-ktx:%s")\n        }\n    }\n}\n' "$BILLING_VERSION" "$BILLING_VERSION" >> "$ROOT"
          else
            printf '\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            force "com.android.billingclient:billing:%s"\n            force "com.android.billingclient:billing-ktx:%s"\n        }\n    }\n}\n' "$BILLING_VERSION" "$BILLING_VERSION" >> "$ROOT"
          fi
          tail -12 "$ROOT"

      - name: Verify resolved Billing version
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon | grep -i billing || true

      - name: Ensure Billing permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "com.android.vending.BILLING" $MANIFEST || \
            sed -i 's|<application |<uses-permission android:name="com.android.vending.BILLING" />\n    <application |' $MANIFEST
          grep -n "BILLING" $MANIFEST || true

      - name: Harden network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="false" />\n</network-security-config>\n' > android/app/src/main/res/xml/network_security_config.xml
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:usesCleartextTraffic="true"/android:usesCleartextTraffic="false"/' $MANIFEST || true
          grep -q "networkSecurityConfig" $MANIFEST || \
            sed -i 's|<application |<application android:networkSecurityConfig="@xml/network_security_config" |' $MANIFEST
          grep -n "usesCleartextTraffic\|networkSecurityConfig" $MANIFEST || true

      - name: Set version, applicationId, app name and SDK
        working-directory: android/app
        run: |
          CODE="${{ steps.version.outputs.code }}"
          NAME="${{ steps.version.outputs.name }}"
          if [ -f "build.gradle.kts" ]; then
            sed -i -E "s/versionCode\s*=\s*.*/versionCode = ${CODE}/" build.gradle.kts
            sed -i -E "s/versionName\s*=\s*\".*\"/versionName = \"${NAME}\"/" build.gradle.kts
            sed -i -E "s/applicationId\s*=\s*\".*\"/applicationId = \"${APP_ID}\"/" build.gradle.kts
            sed -i -E "s/targetSdk\s*=\s*[0-9]+/targetSdk = ${TARGET_SDK}/" build.gradle.kts || true
            sed -i -E "s/compileSdk\s*=\s*[0-9]+/compileSdk = ${COMPILE_SDK}/" build.gradle.kts || true
            GRADLE_FILE="build.gradle.kts"
          elif [ -f "build.gradle" ]; then
            sed -i -E "s/versionCode[[:space:]]+.*/versionCode ${CODE}/" build.gradle
            sed -i -E "s/versionName[[:space:]]+\".*\"/versionName \"${NAME}\"/" build.gradle
            sed -i -E "s/applicationId[[:space:]]+\".*\"/applicationId \"${APP_ID}\"/" build.gradle
            sed -i -E "s/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion ${TARGET_SDK}/" build.gradle || true
            sed -i -E "s/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion ${COMPILE_SDK}/" build.gradle || true
            GRADLE_FILE="build.gradle"
          else
            echo "Error: gradle file not found"; ls -la; exit 1
          fi
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME}</string>|" src/main/res/values/strings.xml || true
          grep -E "applicationId|versionCode|versionName" $GRADLE_FILE

      # --------------------------------------------------------------
      # بناء غير موقّع: APK + AAB
      # --------------------------------------------------------------
      - name: Build unsigned release AAB + APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease assembleRelease --no-daemon

      - name: List outputs
        run: |
          find android/app/build/outputs -name "*.aab" -o -name "*.apk" | sort

      - uses: actions/upload-artifact@v4
        with:
          name: pharaoh-android-unsigned-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
